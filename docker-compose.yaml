version: '3.8'  # Use a more recent version for better features
services:
  my_app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8003"  # Ensure this matches your app's listening port
    depends_on:
      postgres:
        condition: service_healthy  # Wait for PostgreSQL to be healthy
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/postgres  # Update with your database name

  postgres:
    image: postgres:17-bullseye
    ports:
      - "5432:5432"  # Exposing PostgreSQL on port 5433 on the host
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres  # Specify a default database
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistent data storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: